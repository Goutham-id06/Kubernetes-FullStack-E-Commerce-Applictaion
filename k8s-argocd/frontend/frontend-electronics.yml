apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-electronics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Goutham-id06/Kubernetes-FullStack-E-Commerce-Applictaion.git
    path: frontend/electronics
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: microservices
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
